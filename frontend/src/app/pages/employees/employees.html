<div class="container mt-4">

    <h2>Employees</h2>

    <form [formGroup]="employeeForm" (ngSubmit)="saveEmployee()">

        <div class="row">

            <div class="col-md-3">

                <input class="form-control" placeholder="Employee Id" formControlName="employeeId">

            </div>

            <div class="col-md-3">

                <input class="form-control" placeholder="Name" formControlName="name">

            </div>

            <div class="col-md-3">

                <input class="form-control" placeholder="Email" formControlName="email">

            </div>

            <div class="col-md-3">

                <input class="form-control" placeholder="Designation" formControlName="designation">

            </div>

        </div>

        <br>

        <button class="btn btn-primary">

            {{ editMode ? 'Update' : 'Save' }}

        </button>

    </form>

    <hr>

    <table class="table table-bordered table-striped">

        <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Designation</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let employee of employees()">

                <td>{{employee.employeeId}}</td>

                <td>{{employee.name}}</td>

                <td>{{employee.email}}</td>

                <td>{{employee.designation}}</td>

                <td>

                    <a class="btn btn-info btn-sm me-2"
                       [routerLink]="['/employees', employee.employeeId]">

                        Details

                    </a>

                    <button class="btn btn-warning btn-sm me-2" (click)="editEmployee(employee)">

                        Edit

                    </button>

                    <button class="btn btn-danger btn-sm" (click)="deleteEmployee(employee.employeeId)">

                        Delete

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>

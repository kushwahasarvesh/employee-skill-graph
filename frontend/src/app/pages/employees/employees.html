<div class="container mt-4">

    <h2>Employees</h2>

    <form [formGroup]="employeeForm" (ngSubmit)="saveEmployee()">

        <div class="row">

            <div class="col-md-3">

                <input class="form-control" placeholder="Employee Id" formControlName="employeeId">

            </div>

            <div class="col-md-3">

                <input class="form-control" placeholder="Name" formControlName="name">

            </div>

            <div class="col-md-3">

                <input class="form-control"
                    type="email"
                    placeholder="Email"
                    formControlName="email"
                    [class.is-invalid]="email?.invalid && email?.touched">
                <div class="invalid-feedback d-block" *ngIf="email?.touched && email?.hasError('required')">
                    Email ID is required
                </div>
                <div class="invalid-feedback d-block" *ngIf="email?.touched && email?.hasError('pattern')">
                    Please enter a valid email ID
                </div>

            </div>

            <div class="col-md-3">

                <input class="form-control" placeholder="Designation" formControlName="designation">

            </div>

        </div>

        <br>

        <button class="btn btn-primary">

            {{ editMode ? 'Update' : 'Save' }}

        </button>

    </form>

    <hr>

    <table class="table table-bordered table-striped">

        <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Designation</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngIf="employees().length === 0">
                <td colspan="5" class="empty-table-message">No record found of employee</td>
            </tr>

            <tr class="employee-row"
                *ngFor="let employee of employees()"
                (click)="openEmployeeDetails(employee)">

                <td>{{employee.employeeId}}</td>

                <td>{{employee.name}}</td>

                <td>{{employee.email}}</td>

                <td>{{employee.designation}}</td>

                <td (click)="$event.stopPropagation()">

                    <button class="btn btn-warning btn-sm me-2" (click)="editEmployee(employee)">

                        Edit

                    </button>

                    <button class="btn btn-danger btn-sm" (click)="deleteEmployee(employee)">

                        Delete

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>
